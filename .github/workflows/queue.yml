# Plik umieść jako .github/workflows/queue.yml
# Co 5 minut (pn–pt, w godzinach pracy totemu) pobiera kolejkę radiowęzła i zapisuje ją
# do queue.json w repozytorium. Strona na GitHub Pages czyta ten plik, więc CORS nie gra roli.
name: Kolejka radiowęzła

on:
  schedule:
    - cron: '*/5 4-16 * * 1-5'   # czas UTC: obejmuje 7:00–17:25 zarówno zimą, jak i latem
  workflow_dispatch:              # pozwala uruchomić ręcznie (Actions → Run workflow)

permissions:
  contents: write

concurrency:
  group: kolejka-radiowezla
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz kolejkę
        run: |
          curl -fsS --max-time 20 https://radio.zsi.kielce.pl/api/public/queue -o /tmp/queue.json
          python3 -c "import json; json.load(open('/tmp/queue.json'))"   # przerwij, jeśli to nie jest poprawny JSON
          cp /tmp/queue.json queue.json                                  # ścieżka: obok index.html

      - name: Zapisz, jeśli się zmieniła
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add queue.json
          git diff --cached --quiet || (git commit -m "Aktualizacja kolejki radiowęzła" && git push)
